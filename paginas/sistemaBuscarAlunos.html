<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar aluno</title>
    <script src="../scripts/sistemaBuscarAlunos.js" defer></script>
</head>
<body>
    <label for="nomeAluno">Nome do aluno</label>
    <input type="text" id="nomeAluno">
    <label for="idadeAluno">Idade do aluno</label>
    <input type="number" id="idadeAluno">
    <select name="curso" id="curso">
        <option value="DS">Desenvolvimento de Sistemas</option>
        <option value="TI">Tecnico em informatica</option>
        <option value="ADM">Administração</option>
        <option value="MEC">Mecânica</option>
    </select>

    <label for="Matricula">Matricula</label>
    <input type="number" placeholder="Gerada automaticamente" id="matricula" readonly>

    <button onclick="CadastrandoAluno()">Cadastrar</button><br>
    
    <input type="text" id="inputPesquisa" placeholder="Buscar com nome do aluno">
     <select name="curso" id="cursoFiltro">
        <option value="todos">Todos os cursos</option>
        <option value="DS">Desenvolvimento de Sistemas</option>
        <option value="TI">Tecnico em informatica</option>
        <option value="ADM">Administração</option>
        <option value="MEC">Mecânica</option>
    </select>

    <div class="alunos">
       
    </div>
</body>
</html>
